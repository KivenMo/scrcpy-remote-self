apply plugin: 'com.android.application'

android {
    namespace 'com.wb.remoteagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.wb.remoteagent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

// 故意不引入任何第三方依赖：
//   - 网络用原生 Socket
//   - JSON 用系统自带的 org.json
//   - UI 用原生 View，不用 androidx
// 这样构建完全离线，APK 也小。
dependencies {
}
